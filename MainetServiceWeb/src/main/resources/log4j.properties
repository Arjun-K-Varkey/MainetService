# Root logger option
#log4j.rootLogger=ERROR, file, stdout
#log4j.logger.com.abm=INFO, file, stdout
log4j.rootLogger=ERROR, file, stdout
log4j.logger.com.abm=INFO, file, stdout
log4j.additivity.com.abm=false
 
# Direct log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
#log4j.appender.file.File=/home/app/logs/MainetService.log
log4j.appender.file.File=/opt/logs/MainetService.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L URL:%X{URL} ORGID:%X{ORGID} USERID:%X{USER} ReqUUID:%X{requestUUID} TimeTaken:%X{duration} - %m%n
log4j.logger.com.abm.mainet.common.logging.MainetRequestLoggingFilter=DEBUG, file

 
# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

#Hibernate will log only ERROR
log4j.logger.org.hibernate=ERROR

#APACHE CXF will log only DEBUG
##log4j.logger.org.apache.cxf=DEBUG

# enable to print/log, SQL query fired to database
log4j.logger.org.hibernate.SQL=debug

# infracture appender
log4j.logger.com.abm.mainet.common.utility.RestClient=INFO, infracture
log4j.appender.infracture=org.apache.log4j.RollingFileAppender
#log4j.appender.infracture.File=/home/app/logs/SERVICE_INTERFACE.log
log4j.appender.infracture.File=/opt/logs/SERVICE_INTERFACE.log
log4j.appender.infracture.MaxFileSize=10MB
log4j.appender.infracture.MaxBackupIndex=10
log4j.appender.infracture.layout=org.apache.log4j.PatternLayout
log4j.appender.infracture.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L ReqUUID:%X{requestUUID} - %m%n
log4j.additivity.com.abm.mainet.integration.ws.JersyCall=false
# async appender add for performance improvement
log4j.appender.async=org.apache.log4j.AsyncAppender
log4j.appender.async.BufferSize=2048