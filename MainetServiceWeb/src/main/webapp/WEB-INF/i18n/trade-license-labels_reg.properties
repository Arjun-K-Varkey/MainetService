content10 = \u0939\u093E \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u091A\u093E\u0932\u0935\u0924\u093E\u0928\u093E \u092E\u0940 \u0915\u094B\u0923\u0924\u0947\u0939\u0940 \u091C\u094D\u0935\u0932\u0928\u0936\u0940\u0932 \u092A\u0926\u093E\u0930\u094D\u0925 \u0920\u0947\u0935\u0923\u093E\u0930 \u0928\u093E\u0939\u0940 \u0906\u0923\u093F \u092A\u0930\u093F\u0938\u0930 \u092A\u0942\u0930\u094D\u0923\u092A\u0923\u0947 \u0938\u094D\u0935\u091A\u094D\u091B \u0920\u0947\u0935\u0947\u0932. \u0905\u0928\u094D\u092F\u0925\u093E \u092E\u0940 \u0905\u092D\u093F\u0938\u0930\u0923 \u0926\u0947\u0908\u0928.
content11 =\u092E\u093E\u091D\u094D\u092F\u093E \u0906\u0935\u093E\u0930\u093E\u091A\u093E \u0926\u093E\u0916\u0935\u0932\u0947\u0932\u093E \u092A\u0924\u094D\u0924\u093E \u092C\u0930\u094B\u092C\u0930 \u0906\u0939\u0947.
content12 = \u092E\u0940 \u092F\u093E\u0926\u094D\u0935\u093E\u0930\u0947 \u0918\u094B\u0937\u093F\u0924 \u0915\u0930\u0924\u094B \u0915\u0940 \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u092A\u0930\u0935\u093E\u0928\u093E \u091C\u093E\u0930\u0940 \u0915\u0930\u0924\u093E\u0928\u093E \u0932\u093E\u0917\u0942 \u0939\u094B\u0923\u093E\u0931\u094D\u092F\u093E \u0938\u0930\u094D\u0935 \u0905\u091F\u0940 \u0906\u0923\u093F \u0936\u0930\u094D\u0924\u0940 \u092E\u093E\u091D\u094D\u092F\u093E\u0935\u0930 \u092C\u0902\u0927\u0928\u0915\u093E\u0930\u0915 \u0905\u0938\u0924\u0940\u0932.
content13 = \u0935\u093F\u0926\u094D\u092F\u092E\u093E\u0928 \u091C\u093E\u0917\u0947\u0924 \u0939\u093E \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u091A\u093E\u0932\u0935\u0923\u094D\u092F\u093E\u091A\u0940 \u092A\u0930\u0935\u093E\u0928\u0917\u0940 \u0915\u0932\u094D\u092F\u093E\u0923 \u0921\u094B\u0902\u092C\u093F\u0935\u0932\u0940 \u092E\u0939\u093E\u0928\u0917\u0930\u092A\u093E\u0932\u093F\u0915\u0947\u091A\u094D\u092F\u093E \u0906\u092F\u0941\u0915\u094D\u0924\u093E\u0928\u0947 \u0926\u093F\u0932\u0940 \u0906\u0939\u0947. \u0924\u0940 \u0915\u094B\u0923\u0924\u0947\u0939\u0940 \u0915\u093E\u0930\u0923 \u0928 \u0926\u0947\u0924\u093E \u0906\u092F\u0941\u0915\u094D\u0924\u093E\u0902\u0915\u0921\u0942\u0928 \u0915\u0927\u0940\u0939\u0940 \u092E\u093E\u0917\u0947 \u0918\u0947\u0924\u093E / \u0930\u0926\u094D\u0926 / \u0930\u0926\u094D\u0926 \u0915\u0947\u0932\u0947 \u091C\u093E\u090A \u0936\u0915\u0924\u0947.
content14 = \u091C\u0930 \u0918\u094B\u0937\u0923\u093E\u092A\u0924\u094D\u0930 \u0906\u0923\u093F \u0905\u0930\u094D\u091C\u093E\u092E\u0927\u094D\u092F\u0947 \u0926\u093F\u0932\u0947\u0932\u0940 \u092E\u093E\u0939\u093F\u0924\u0940 \u091A\u0941\u0915\u0940\u091A\u0940 \u0906\u0922\u0933\u0932\u0940 \u0924\u0930 \u092E\u093E\u091D\u093E \u092A\u0930\u0935\u093E\u0928\u093E \u0906\u092A\u094B\u0906\u092A \u0930\u0926\u094D\u0926 \u0939\u094B\u0908\u0932.
content15 = \u0939\u093E \u0905\u0928\u094D\u0928 \u092A\u0930\u0935\u093E\u0928\u093E \u0905\u0938\u0932\u094D\u092F\u093E\u0938, \u0905\u0928\u094D\u0928 \u0938\u0941\u0930\u0915\u094D\u0937\u093E \u0906\u0923\u093F \u092D\u093E\u0930\u0924 \u0938\u0930\u0915\u093E\u0930 /  \u092E\u0939\u093E\u0930\u093E\u0937\u094D\u091F\u094D\u0930 \u0936\u093E\u0938\u0928\u093E\u0928\u0947 \u0935\u0947\u0933\u094B\u0935\u0947\u0933\u0940 \u0915\u0947\u0932\u0947\u0932\u0947 \u0938\u0930\u094D\u0935 \u0928\u093F\u092F\u092E/\u0924\u0930\u0924\u0941\u0926\u0940 \u0928\u093F\u092F\u092E\u093E\u0902\u0928\u0941\u0938\u093E\u0930 \u092A\u093E\u0933\u0932\u094D\u092F\u093E \u091C\u093E\u0924\u0940\u0932.
content16 = \u0915\u0940 \u092E\u0940 \u0938\u0902\u092C\u0902\u0927\u093F\u0924 \u0935\u094D\u092F\u0935\u0938\u093E\u092F\u093E\u0938\u093E\u0920\u0940 \u0932\u093E\u0917\u0942 \u0905\u0938\u0932\u0947\u0932\u094D\u092F\u093E \u0938\u0930\u094D\u0935 \u0928\u093F\u092F\u092E\u093E\u0902\u091A\u0947 \u092A\u0942\u0930\u094D\u0923\u092A\u0923\u0947 \u092A\u093E\u0932\u0928 \u0915\u0930\u0940\u0928.
content17 = \u0915\u094B\u0923\u0924\u094D\u092F\u093E\u0939\u0940 \u092A\u094D\u0930\u0915\u093E\u0930\u091A\u094D\u092F\u093E \u0916\u091F\u0932\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u092C\u093E\u092C\u0924\u0940\u0924, \u0905\u0927\u093F\u0915\u093E\u0930\u0915\u094D\u0937\u0947\u0924\u094D\u0930 \u0915\u0932\u094D\u092F\u093E\u0923 \u0905\u0938\u0947\u0932.
content18 = \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u092C\u0902\u0926 \u091D\u093E\u0932\u094D\u092F\u093E\u0938, \u0911\u092B\u093F\u0938\u092E\u0927\u094D\u092F\u0947 \u0905\u0930\u094D\u091C\u093E\u0938\u0939 \u092E\u0942\u0933 \u092A\u0930\u0935\u093E\u0928\u093E \u0938\u093E\u0926\u0930 \u0915\u0930\u093E\u0935\u093E \u0932\u093E\u0917\u0947\u0932.
content19 = \u0938\u093F\u0917\u093E\u0930\u0947\u091F \u0906\u0923\u093F \u0924\u0902\u092C\u093E\u0916\u0942 \u0909\u0924\u094D\u092A\u093E\u0926\u0928\u0947 \u0905\u0927\u093F\u0928\u093F\u092F\u092E 2003 \u0906\u0923\u093F \u0938\u093E\u0930\u094D\u0935\u091C\u0928\u093F\u0915 \u0920\u093F\u0915\u093E\u0923\u0940 \u0927\u0942\u092E\u094D\u0930\u092A\u093E\u0928 \u092A\u094D\u0930\u0924\u093F\u092C\u0902\u0927\u093F\u0924 \u0928\u093F\u092F\u092E 2008 \u0905\u0902\u0924\u0930\u094D\u0917\u0924 \u0924\u092F\u093E\u0930 \u0915\u0947\u0932\u0947\u0932\u094D\u092F\u093E \u0909\u092A\u0935\u093F\u0927\u0940 \u0905\u0902\u0924\u0930\u094D\u0917\u0924, \u092E\u0940 \u0935\u0930 \u0928\u092E\u0942\u0926 \u0915\u0947\u0932\u0947\u0932\u094D\u092F\u093E \u0906\u0935\u093E\u0930\u093E\u0924 \u0938\u0947\u0935\u093E / \u092A\u0926\u093E\u0930\u094D\u0925\u093E\u0902\u091A\u0947 \u0909\u0924\u094D\u092A\u093E\u0926\u0928 / \u0935\u093F\u0915\u094D\u0930\u0940 / \u0938\u093E\u0920\u0935\u0923 / \u0935\u093F\u0924\u0930\u0923 / \u0935\u093F\u0924\u0930\u0923 / \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u0915\u0930\u0923\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u092A\u0930\u0935\u093E\u0928\u094D\u092F\u093E\u091A\u0947 \u092A\u093E\u0932\u0928 \u0915\u0930\u0947\u0928. .
content20 = \u0930\u093E\u091C\u094D\u092F \u0938\u0930\u0915\u093E\u0930 \u0906\u0923\u093F \u0938\u094D\u0925\u093E\u0928\u093F\u0915 \u091C\u093F\u0932\u094D\u0939\u093E \u092A\u094D\u0930\u0936\u093E\u0938\u0928\u093E\u0928\u0947 \u0935\u0947\u0933\u094B\u0935\u0947\u0933\u0940 \u0938\u093F\u0917\u093E\u0930\u0947\u091F \u0906\u0923\u093F \u0907\u0924\u0930 \u0924\u0902\u092C\u093E\u0916\u0942 \u0909\u0924\u094D\u092A\u093E\u0926\u0928\u0947 \u0905\u0927\u093F\u0928\u093F\u092F\u092E 2003 \u0905\u0902\u0924\u0930\u094D\u0917\u0924 \u0915\u0947\u0932\u0947\u0932\u094D\u092F\u093E \u0905\u091F\u0940 \u0935 \u0936\u0930\u094D\u0924\u0940\u0902\u091A\u0947 \u092E\u0940 \u092A\u0942\u0930\u094D\u0923\u092A\u0923\u0947 \u092A\u093E\u0932\u0928 \u0915\u0930\u0940\u0928. \u0915\u094B\u0923\u0924\u094D\u092F\u093E\u0939\u0940 \u0905\u091F\u0940 \u0906\u0923\u093F \u0936\u0930\u094D\u0924\u0940\u0902\u091A\u0947 \u0909\u0932\u094D\u0932\u0902\u0918\u0928 \u091D\u093E\u0932\u094D\u092F\u093E\u0938,\u0915\u0932\u094D\u092F\u093E\u0923 \u0921\u094B\u0902\u092C\u093F\u0935\u0932\u0940 \u092E\u0939\u093E\u0928\u0917\u0930\u092A\u093E\u0932\u093F\u0915\u0947\u0932\u093E  \u091C\u093E\u0930\u0940 \u0915\u0947\u0932\u0947\u0932\u093E \u092A\u0930\u0935\u093E\u0928\u093E \u0930\u0926\u094D\u0926 \u0915\u0930\u0923\u094D\u092F\u093E\u091A\u093E \u0906\u0923\u093F \u0936\u093F\u0938\u094D\u0924\u092D\u0902\u0917\u093E\u091A\u0940 \u0915\u093E\u0930\u0935\u093E\u0908 \u0906\u0923\u093F \u0926\u0902\u0921\u093E\u0924\u094D\u092E\u0915 \u0915\u093E\u0930\u0935\u093E\u0908 \u0915\u0930\u0923\u094D\u092F\u093E\u091A\u093E \u092A\u0942\u0930\u094D\u0923 \u0905\u0927\u093F\u0915\u093E\u0930 \u0905\u0938\u0947\u0932, \u091C\u094D\u092F\u093E\u091A\u093E \u092E\u0940 \u0928\u094D\u092F\u093E\u092F\u093E\u0932\u092F\u093E\u0924 \u092A\u094D\u0930\u0924\u093F\u0915\u093E\u0930 \u0915\u0930\u0942 \u0936\u0915\u0923\u093E\u0930 \u0928\u093E\u0939\u0940. 
content21 = \u092E\u0940 COPTA \u0938\u093F\u0917\u093E\u0930\u0947\u091F \u0906\u0923\u093F \u0907\u0924\u0930 \u0924\u0902\u092C\u093E\u0916\u0942 \u0909\u0924\u094D\u092A\u093E\u0926\u0928\u0947 (\u091C\u093E\u0939\u093F\u0930\u093E\u0924 \u0906\u0923\u093F \u0935\u094D\u092F\u093E\u092A\u093E\u0930 \u0906\u0923\u093F \u0935\u093E\u0923\u093F\u091C\u094D\u092F \u0909\u0924\u094D\u092A\u093E\u0926\u0928, \u092A\u0941\u0930\u0935\u0920\u093E \u0906\u0923\u093F \u0935\u093F\u0924\u0930\u0923 \u092F\u093E\u0902\u091A\u094D\u092F\u093E \u0926\u0947\u0935\u093E\u0923\u0918\u0947\u0935\u093E\u0923\u0940\u091A\u093E \u092A\u094D\u0930\u0924\u093F\u0915\u093E\u0930) \u0915\u093E\u092F\u0926\u093E 2003 \u0906\u0923\u093F \u0938\u093E\u0930\u094D\u0935\u091C\u0928\u093F\u0915 \u0938\u0902\u0938\u094D\u0925\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u0927\u0942\u092E\u094D\u0930\u092A\u093E\u0928 \u092A\u094D\u0930\u0924\u093F\u092C\u0902\u0927 2008 \u091A\u0947 \u0915\u0920\u094B\u0930\u092A\u0923\u0947 \u092A\u093E\u0932\u0928 \u0915\u0930\u0940\u0928.
