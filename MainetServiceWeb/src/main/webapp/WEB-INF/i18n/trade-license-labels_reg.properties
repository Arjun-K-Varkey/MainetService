content6 = \u0939\u0947 \u0926\u0938\u094D\u0924\u0910\u0935\u091C \u0915\u094B\u0923\u0924\u094D\u092F\u093E\u0939\u0940 \u0938\u0930\u0915\u093E\u0930\u0940 \u090F\u091C\u0928\u094D\u0938\u0940\u092E\u0927\u094D\u092F\u0947 \u0915\u094B\u0923\u0924\u0947\u0939\u0940 \u0913\u0933\u0916\u092A\u0924\u094D\u0930 \u092E\u093F\u0933\u0935\u0923\u094D\u092F\u093E\u0938\u093E\u0920\u0940 \u0935\u093E\u092A\u0930\u0932\u0947 \u091C\u093E\u0923\u093E\u0930 \u0928\u093E\u0939\u0940.
content7 = \u092F\u093E \u0935\u094D\u092F\u0935\u0938\u093E\u092F \u092A\u0930\u0935\u093E\u0928\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u0906\u0927\u093E\u0930\u093E\u0935\u0930 \u092E\u093E\u0932\u092E\u0924\u094D\u0924\u0947\u091A\u094D\u092F\u093E / \u091C\u093E\u0917\u0947\u091A\u094D\u092F\u093E \u092E\u093E\u0932\u0915\u0940\u0938\u093E\u0920\u0940 \u0926\u093E\u0935\u093E \u0915\u0947\u0932\u093E \u091C\u093E\u0923\u093E\u0930 \u0928\u093E\u0939\u0940.
content8 = \u092E\u093E\u0932\u0915 / \u092D\u093E\u0917\u0940\u0926\u093E\u0930 / \u0938\u0902\u091A\u093E\u0932\u0915 / \u0938\u0926\u0938\u094D\u092F \u092F\u093E\u0902\u091A\u093E \u092E\u0943\u0924\u094D\u092F\u0942 \u091D\u093E\u0932\u094D\u092F\u093E\u0938, \u092E\u0940 \u0915\u0932\u094D\u092F\u093E\u0923 \u0921\u094B\u0902\u092C\u093F\u0935\u0932\u0940 \u092E\u0939\u093E\u0928\u0917\u0930\u092A\u093E\u0932\u093F\u0915\u0947\u0932\u093E \u092E\u0943\u0924\u094D\u092F\u0942 \u092A\u094D\u0930\u092E\u093E\u0923\u092A\u0924\u094D\u0930\u093E\u0938\u0939 \u0938\u0942\u091A\u093F\u0924 \u0915\u0930\u0940\u0928.
